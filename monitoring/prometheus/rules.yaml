# Alert rules. They are evaluated by Prometheus and appear in Grafana under
# Alerting > Alert rules (Prometheus data source) and in Prometheus under Alerts.
# NOTHING is sent anywhere: no email, Telegram, Slack or WhatsApp is configured.
# You see a firing alert only by opening Grafana or Prometheus.
# Reload after changing: see prometheus/configmap.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
  labels: {app: prometheus}
data:
  rules.yml: |
    groups:
      - name: barbershop-app
        rules:
          - alert: AppTargetDown
            expr: up{job="barbershop-apps"} == 0
            for: 3m
            labels: {severity: critical}
            annotations:
              summary: "{{ $labels.service }} metrics are not reachable"
              description: "Prometheus cannot scrape {{ $labels.service }} ({{ $labels.pod }}). The service may be down, or the metrics port is blocked (NetworkPolicy)."
          - alert: AppNoMetricsTargets
            expr: count(up{job="barbershop-apps"}) < 3 or absent(up{job="barbershop-apps"})
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: "Fewer than 3 app services are being scraped"
              description: "Expected web, booking-api and identity-api. A service is missing, not yet redeployed with metrics, or its pod has no 'metrics' port."
          - alert: AppHigh5xxRatio
            expr: |
              sum by (service) (rate(django_http_responses_total_by_status_total{job="barbershop-apps",status=~"5.."}[5m]))
                / sum by (service) (rate(django_http_responses_total_by_status_total{job="barbershop-apps"}[5m])) > 0.05
              and sum by (service) (rate(django_http_responses_total_by_status_total{job="barbershop-apps"}[5m])) > 0.05
            for: 5m
            labels: {severity: critical}
            annotations:
              summary: "{{ $labels.service }}: more than 5% of responses are server errors"
              description: "5xx ratio is {{ $value | humanizePercentage }} over 5 minutes."
          - alert: AppSlowResponses
            expr: |
              histogram_quantile(0.95, sum by (le, service) (rate(django_http_requests_latency_including_middlewares_seconds_bucket{job="barbershop-apps"}[5m]))) > 1
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: "{{ $labels.service }}: 95% of requests take longer than 1 second"
              description: "p95 latency is {{ $value | humanizeDuration }} over 5 minutes."

      - name: barbershop-database
        rules:
          - alert: PostgresDown
            expr: pg_up == 0 or absent(pg_up)
            for: 2m
            labels: {severity: critical}
            annotations:
              summary: "PostgreSQL metrics report the database as down or missing"
              description: "pg_up is 0 or the exporter is not reporting. If you have not yet created the monitoring role and Secret, this is expected."
          - alert: PostgresConnectionsHigh
            expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: "PostgreSQL is using more than 80% of its connections"
              description: "Usage is {{ $value | humanizePercentage }}."
          - alert: PostgresDeadlocks
            expr: increase(pg_stat_database_deadlocks{datname=~"booking|identity"}[15m]) > 0
            labels: {severity: warning}
            annotations:
              summary: "Deadlocks in database {{ $labels.datname }}"
              description: "{{ $value }} deadlock(s) in the last 15 minutes."

      - name: barbershop-kubernetes
        rules:
          - alert: PodNotReady
            expr: kube_pod_status_ready{namespace="barbershop",condition="true"} == 0
            for: 5m
            labels: {severity: critical}
            annotations:
              summary: "Pod {{ $labels.pod }} has not been ready for 5 minutes"
          - alert: PodRestartingOften
            expr: increase(kube_pod_container_status_restarts_total{namespace=~"barbershop|monitoring"}[30m]) > 2
            labels: {severity: warning}
            annotations:
              summary: "{{ $labels.pod }} ({{ $labels.container }}) restarted more than 2 times in 30 minutes"
          - alert: ContainerOOMKilled
            expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled",namespace=~"barbershop|monitoring"} == 1 and on (namespace, pod, container) (increase(kube_pod_container_status_restarts_total[30m]) > 0)
            labels: {severity: warning}
            annotations:
              summary: "{{ $labels.pod }} ({{ $labels.container }}) was killed for using too much memory"
          - alert: ContainerMemoryNearLimit
            expr: |
              max by (namespace, pod, container) (container_memory_working_set_bytes{namespace=~"barbershop|monitoring",container!=""})
                / max by (namespace, pod, container) (kube_pod_container_resource_limits{namespace=~"barbershop|monitoring",resource="memory"}) > 0.9
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: "{{ $labels.pod }} ({{ $labels.container }}) uses more than 90% of its memory limit"
          - alert: VolumeAlmostFull
            expr: kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 0.8
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: "Volume {{ $labels.persistentvolumeclaim }} is more than 80% full"
          - alert: NodePodSlotsAlmostFull
            expr: |
              count by (node) (kube_pod_info{node!=""}) / on (node) kube_node_status_allocatable{resource="pods"} > 0.9
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: "Node {{ $labels.node }} is above 90% of its pod limit"
              description: "New pods may not be schedulable on this node."
          - alert: CloudflaredPodRecentlyStarted
            expr: (time() - kube_pod_start_time{namespace="barbershop",pod=~"cloudflared-.*"}) < 900
            labels: {severity: warning}
            annotations:
              summary: "The cloudflared pod started in the last 15 minutes"
              description: "This is a signal only. A new quick tunnel usually means a new trycloudflare.com URL. It does not prove what the current URL is. Check the runbook in k8s-eks/cloudflared/README.md."
          - alert: DeploymentReplicasMissing
            expr: kube_deployment_status_replicas_available{namespace=~"barbershop|monitoring"} < kube_deployment_spec_replicas{namespace=~"barbershop|monitoring"}
            for: 10m
            labels: {severity: critical}
            annotations:
              summary: "Deployment {{ $labels.deployment }} has fewer pods available than wanted"

      - name: barbershop-nodes
        rules:
          - alert: MonitoringTargetDown
            expr: up{job=~"kube-state-metrics|node-exporter|kubelet-cadvisor|kubelet|postgres|prometheus"} == 0
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: "Monitoring source {{ $labels.job }} ({{ $labels.instance }}) is not reachable"
          - alert: NodeMemoryLow
            expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: "Node {{ $labels.node }} has less than 10% memory available"
          - alert: NodeCpuHigh
            expr: 1 - avg by (node) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.9
            for: 15m
            labels: {severity: warning}
            annotations:
              summary: "Node {{ $labels.node }} CPU is above 90%"
              description: "t3 nodes also run out of CPU credits, so a sustained high value matters."
          - alert: NodeDiskLow
            expr: |
              node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 0.15
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: "Node {{ $labels.node }}: less than 15% free on {{ $labels.mountpoint }}"
