# Stores 7 days of metrics, at most 1GB, on a temporary disk (emptyDir). If this
# pod is replaced, the stored history is lost and starts again. That is a
# deliberate choice for now: no extra EBS volume, no extra cost. Dashboards and
# alert rules are in Git and are not affected.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels: {app: prometheus}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --storage.tsdb.retention.size=1GB
            - --web.enable-lifecycle
          ports:
            - {name: http, containerPort: 9090}
          readinessProbe:
            httpGet: {path: /-/ready, port: 9090}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /-/healthy, port: 9090}
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml, readOnly: true}
            - {name: rules, mountPath: /etc/prometheus/rules, readOnly: true}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
        - name: rules
          configMap: {name: prometheus-rules}
        - name: data
          emptyDir: {sizeLimit: 2Gi}
