# grafana: no ingress at all. You open it with kubectl port-forward, which is
# not affected by network policy (same note as the gateway policy), so there is
# no public address. It may only call Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana
  namespace: monitoring
spec:
  podSelector: {matchLabels: {app: grafana}}
  policyTypes: [Ingress, Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app: prometheus}}}]
      ports: [{protocol: TCP, port: 9090}]
