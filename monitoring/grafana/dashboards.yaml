# Grafana dashboard, loaded automatically from this ConfigMap (see the
# dashboards provider). The dashboard is read-only in the UI: to change it,
# edit it in Git. Panels with no data yet are expected until the matching
# piece is deployed (app metrics, database role).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels: {app: grafana}
data:
  barbershop-overview.json: |
    {
      "uid": "barbershop-overview",
      "title": "Barbershop: everything",
      "tags": [
        "barbershop"
      ],
      "timezone": "Africa/Cairo",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "editable": false,
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Site: requests, errors, speed (Django services, per service)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Services reporting",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(up{job=\"barbershop-apps\"} == 1)",
              "legendFormat": "",
              "refId": "A",
              "instant": true
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 2
                  },
                  {
                    "color": "green",
                    "value": 3
                  }
                ]
              },
              "mappings": [],
              "noValue": "no data"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto"
          },
          "description": "Expected 3: web, booking-api, identity-api. Shows no data until the app images with metrics are deployed."
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Server errors (5xx) per second",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
