              "expr": "sum(rate(django_http_responses_total_by_status_total{job=\"barbershop-apps\",status=~\"5..\"}[5m]))",
              "legendFormat": "",
              "refId": "A",
              "instant": true
            }
          ],
          "gridPos": {
            "x": 4,
            "y": 1,
            "w": 4,
            "h": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.01
