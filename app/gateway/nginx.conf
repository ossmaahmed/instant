# Single entry point for the whole system.
#   /              -> web (the Arabic UI)
#   /api/booking/  -> booking-api (also handy for direct API exploration)
#   /api/identity/ -> identity-api
# The database is on a separate network and cannot be reached from here.
server {
    listen 8000;
    server_name _;

    # Resolve container names at request time (Docker's embedded DNS), so a
    # restarted service with a new address does not require a gateway reload.
    resolver 127.0.0.11 valid=10s;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location /api/booking/ {
        set $upstream http://booking-api:8001;
        proxy_pass $upstream;
        proxy_set_header Host $http_host; # exact client Host incl. port; $host strips the port and breaks Django CSRF origin checks (403 on every POST)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/identity/ {
        set $upstream http://identity-api:8002;
        proxy_pass $upstream;
        proxy_set_header Host $http_host; # exact client Host incl. port; $host strips the port and breaks Django CSRF origin checks (403 on every POST)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header Host $http_host; # exact client Host incl. port; $host strips the port and breaks Django CSRF origin checks (403 on every POST)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
