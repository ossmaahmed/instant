# Argo CD Application: watches the four Deployment files in GitHub and shows
# the difference from the cluster. Manual sync only (no syncPolicy block).
# Apply it with kubectl to the instant-eks context. Keep this file outside k8s-eks.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: barbershop
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ossmaahmed/instant.git
    targetRevision: main
    path: k8s-eks
    directory:
      recurse: true
      include: '{gateway/deployment.yaml,web/deployment.yaml,booking-api/deployment.yaml,identity-api/deployment.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: barbershop
