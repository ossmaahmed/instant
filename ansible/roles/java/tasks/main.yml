---
- name: Install Java 21
  ansible.builtin.dnf:
    name: java-21-amazon-corretto
    state: present
    update_cache: true

- name: Remove Java 17 so Java 21 is the only runtime
  ansible.builtin.dnf:
    name:
      - java-17-amazon-corretto
      - java-17-amazon-corretto-headless
    state: absent
