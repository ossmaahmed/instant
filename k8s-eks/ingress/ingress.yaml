# Public HTTP entry via an AWS Application Load Balancer, created by the AWS
# Load Balancer Controller. Traffic goes to the gateway (nginx), which keeps
# the same /, /api/booking/, /api/identity/ routing as docker compose.
# HTTP only for now: HTTPS needs an ACM certificate ARN and a DNS name.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: barbershop
  namespace: barbershop
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8000
