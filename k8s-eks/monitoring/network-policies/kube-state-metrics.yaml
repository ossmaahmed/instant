# kube-state-metrics: only Prometheus may read it. It calls the Kubernetes API
# (443), allowed by address block (see prometheus.yaml for the two ranges).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  podSelector: {matchLabels: {app: kube-state-metrics}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: prometheus}}}]
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - ipBlock: {cidr: 10.0.0.0/16}
        - ipBlock: {cidr: 172.20.0.0/16}
      ports: [{protocol: TCP, port: 443}]
