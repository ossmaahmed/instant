# Custom booking queries. They read only the aggregate views in the
# "monitoring" schema (counts, no personal data). The exporter marks this
# queries.yaml format as deprecated but still supports it in v0.17.1.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-exporter-queries
  namespace: monitoring
  labels: {app: postgres-exporter}
data:
  queries.yaml: |
    booking_totals:
      query: "SELECT status, source, bookings FROM monitoring.booking_totals"
      master: true
      metrics:
        - status:
            usage: "LABEL"
            description: "Booking status: confirmed, completed, no_show, cancelled"
        - source:
            usage: "LABEL"
            description: "Who created it: customer or owner"
        - bookings:
            usage: "GAUGE"
            description: "Bookings in this status (all time)"

    booking_created_24h:
      query: "SELECT source, bookings FROM monitoring.booking_created_24h"
      master: true
      metrics:
        - source:
            usage: "LABEL"
            description: "Who created it: customer or owner"
        - bookings:
            usage: "GAUGE"
            description: "Bookings created in the last 24 hours"

    booking_upcoming:
      query: "SELECT today_remaining, next_7_days FROM monitoring.booking_upcoming"
      master: true
      metrics:
        - today_remaining:
            usage: "GAUGE"
            description: "Confirmed appointments still ahead today (shop time)"
        - next_7_days:
            usage: "GAUGE"
            description: "Confirmed appointments in the next 7 days"
