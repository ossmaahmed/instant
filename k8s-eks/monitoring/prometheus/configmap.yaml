# Prometheus configuration. After you change it: apply the file, wait about a
# minute, then reload without restarting (a restart would drop the stored history):
#   kubectl -n monitoring exec deploy/prometheus -- wget -qO- --post-data= http://localhost:9090/-/reload
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels: {app: prometheus}
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
    rule_files:
      - /etc/prometheus/rules/*.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']

      # The three Django services, on their private metrics port 9102 (not the app port).
      - job_name: barbershop-apps
        kubernetes_sd_configs:
          - role: pod
            namespaces: {names: [barbershop]}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: web|booking-api|identity-api
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # Kubernetes object state: pod ready, restarts, pods per node.
      - job_name: kube-state-metrics
        honor_labels: true
        static_configs:
          - targets: ['kube-state-metrics.monitoring.svc:8080']

      # Node CPU, memory, disk (one node-exporter pod per node).
      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: pod
            namespaces: {names: [monitoring]}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: node-exporter
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node

      # PostgreSQL health and the booking counts (through the read-only role).
      - job_name: postgres
        static_configs:
          - targets: ['postgres-exporter.monitoring.svc:9187']

      # Per-pod CPU and memory, read from each node's kubelet (cAdvisor).
      # The kubelet certificate is not signed for the node IP, so verification
      # is off for this one in-VPC call; access is limited by the read-only
      # token and the NetworkPolicy.
      - job_name: kubelet-cadvisor
        scheme: https
        metrics_path: /metrics/cadvisor
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: container_(cpu_usage_seconds_total|memory_working_set_bytes|spec_memory_limit_bytes|oom_events_total)|machine_(cpu_cores|memory_bytes)
            action: keep

      # Volume usage (the database disk and the web session disk).
      - job_name: kubelet
        scheme: https
        metrics_path: /metrics
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: kubelet_volume_stats_(used|capacity|available)_bytes|kubelet_running_(pods|containers)
            action: keep
