apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: monitoring
  labels: {app: grafana}
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: barbershop
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /var/lib/grafana-dashboards
