# ClusterIP on purpose: nothing is exposed to the internet by this file.
# Test with: kubectl -n barbershop port-forward svc/gateway 8000:8000
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: barbershop
  labels: {app: gateway}
spec:
  selector: {app: gateway}
  ports:
    - name: http
      port: 8000
      targetPort: 8000
