# Same design as identity-api: stateless, per-process SECRET_KEY unused for
# signing. The entrypoint runs migrate and seed_demo on every start, so keep
# 1 replica until migrations move into a Job.
# The image's "app" user is uid/gid 1000: python:3.12-slim has no user >= 1000 and
# UID_MIN 1000 (checked in the base image layer), and the Dockerfile runs plain
# `useradd --create-home app`. If you change the base image, recheck.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-api
  namespace: barbershop
  labels: {app: booking-api}
spec:
  replicas: 1
  selector:
    matchLabels: {app: booking-api}
  template:
    metadata:
      labels: {app: booking-api}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: booking-api
          image: 908124814208.dkr.ecr.us-east-1.amazonaws.com/instant-app:booking-api-7-c2e4e81
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef: {name: booking-api-config}
          env:
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: booking-api-secret, key: DB_PASSWORD}}
          readinessProbe:
            httpGet: {path: /healthz, port: 8001}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8001}
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
