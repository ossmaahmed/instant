# Verified in source: identity-api signs nothing. Owner tokens are opaque
# random strings and only their SHA-256 hash is stored in PostgreSQL, so the
# per-process SECRET_KEY does not matter and replicas can share one database.
# Kept at 1 replica because the container runs "migrate" on every start;
# several pods starting together could race on migrations. Scale only after
# moving migrate into a one-off Job.
# The image's "app" user is uid/gid 1000: python:3.12-slim has no user >= 1000 and
# UID_MIN 1000 (checked in the base image layer), and the Dockerfile runs plain
# `useradd --create-home app`. If you change the base image, recheck.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-api
  namespace: barbershop
  labels: {app: identity-api}
spec:
  replicas: 1
  selector:
    matchLabels: {app: identity-api}
  template:
    metadata:
      labels: {app: identity-api}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: identity-api
          image: 908124814208.dkr.ecr.us-east-1.amazonaws.com/instant-app:identity-api-9-3c36920
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef: {name: identity-api-config}
          env:
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: identity-api-secret, key: DB_PASSWORD}}
          readinessProbe:
            httpGet: {path: /healthz, port: 8002}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8002}
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
