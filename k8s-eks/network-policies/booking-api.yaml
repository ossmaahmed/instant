# booking-api: called by gateway and web; calls identity-api (token check) and PostgreSQL.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: booking-api
  namespace: barbershop
spec:
  podSelector: {matchLabels: {app: booking-api}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: gateway}}
        - podSelector: {matchLabels: {app: web}}
      ports: [{protocol: TCP, port: 8001}]
  egress:
    - to: [{podSelector: {matchLabels: {app: identity-api}}}]
      ports: [{protocol: TCP, port: 8002}]
    - to: [{podSelector: {matchLabels: {app: postgres}}}]
      ports: [{protocol: TCP, port: 5432}]
