# postgres: only the two APIs may connect; it makes no outbound calls.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: barbershop
spec:
  podSelector: {matchLabels: {app: postgres}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: booking-api}}
        - podSelector: {matchLabels: {app: identity-api}}
      ports: [{protocol: TCP, port: 5432}]
