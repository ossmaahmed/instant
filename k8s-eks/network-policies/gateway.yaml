# gateway: two listeners, two trust levels.
#   8001 = tunnel entry. Only cloudflared pods may reach it; nginx trusts
#          X-Forwarded-Proto ONLY on this port.
#   8000 = local / future-ALB entry. No in-cluster ingress is needed today:
#          kubectl port-forward is not affected by network policy, and the
#          public-subnet CIDR blocks return here when an ALB is added later.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway
  namespace: barbershop
spec:
  podSelector: {matchLabels: {app: gateway}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: cloudflared}}
      ports:
        - {protocol: TCP, port: 8001}
  egress:
    - to: [{podSelector: {matchLabels: {app: web}}}]
      ports: [{protocol: TCP, port: 8000}]
    - to: [{podSelector: {matchLabels: {app: booking-api}}}]
      ports: [{protocol: TCP, port: 8001}]
    - to: [{podSelector: {matchLabels: {app: identity-api}}}]
      ports: [{protocol: TCP, port: 8002}]
